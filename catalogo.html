<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoCartas | Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
</head>
<body>
<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container py-3" aria-label="Navegación principal">
        <a class="navbar-brand marca d-flex align-items-center gap-2" href="index.html"><img src="img/logo.svg" alt="" width="40" height="40"><span>NexoCartas</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navNexo" aria-controls="navNexo" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navNexo">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                <li class="nav-item admin-only"><a class="nav-link" href="admin.html">Administración</a></li>
                <li class="nav-item"><a class="nav-link cerrarSesion" href="#">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>
</header>
<main>
    <div class="contenedor-nexo">
        <section class="bloque-nexo" aria-labelledby="catalogoTitulo">
            <h1 id="catalogoTitulo" class="titulo-seccion">Catálogo de cartas</h1>
            <div class="row g-3 mb-3">
                <div class="col-12 col-md-8">
                    <label for="buscar" class="form-label">Buscar por nombre o código</label>
                    <input id="buscar" class="form-control" type="search" placeholder="Ej.: Pikachu o PKM-002" autocomplete="off">
                </div>
                <div class="col-12 col-md-4">
                    <label for="categoria" class="form-label">Categoría</label>
                    <select id="categoria" class="form-select">
                        <option value="Todas">Todas</option>
                    </select>
                </div>
            </div>
            <p id="cantidadResultados" class="text-secondary"></p>
            <div id="listaCartas" class="row g-4" aria-live="polite"></div>
        </section>
    </div>
</main>
<footer>
    <p>&copy; 2026 NexoCartas · Proyecto académico DSY1104 Desarrollo Fullstack II</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/storage.js"></script>
<script src="js/sesion.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
