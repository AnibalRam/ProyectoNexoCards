<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoCartas | Ingreso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="login-fondo">
        <section class="login-card" aria-labelledby="tituloLogin">
            <h1 id="tituloLogin" class="text-center">NexoCartas</h1>
            <p class="text-center text-secondary">Tienda web de cartas coleccionables · Prototipo académico</p>

            <div class="demo-box mb-4">
                <strong>Cuentas de demostración</strong><br>
                Cliente: <code>cliente@nexocartas.cl</code> / <code>1234</code><br>
                Administrador: <code>admin@nexocartas.cl</code> / <code>admin123</code>
            </div>

            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="correo">Correo</label>
                    <input class="form-control" id="correo" type="email" autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="clave">Contraseña</label>
                    <input class="form-control" id="clave" type="password" autocomplete="current-password" required>
                </div>

                <button id="btnIngresar" class="btn btn-nexo w-100" type="submit">Ingresar</button>
                <div id="mensajeLogin" class="alerta-local" role="alert" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <script src="js/datos.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
