<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoCartas | Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container py-3" aria-label="Navegación principal">
        <a class="navbar-brand marca" href="index.html">NexoCartas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navNexo" aria-controls="navNexo" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navNexo">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                <li class="nav-item admin-only"><a class="nav-link" href="admin.html">Administración</a></li>
                <li class="nav-item"><a class="nav-link cerrarSesion" href="#">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>
</header>
<main>
    <div class="contenedor-nexo">
        <section class="bloque-nexo" aria-labelledby="contactoTitulo">
            <h1 id="contactoTitulo" class="titulo-seccion">Formulario de consulta</h1>
            <p>Completa los datos. La validación se realiza con JavaScript y no se envía información a un servidor.</p>

            <form id="formContacto" class="mx-auto" style="max-width: 720px" novalidate>
                <div class="mb-2">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input id="nombre" class="form-control" type="text" autocomplete="name" placeholder="Tu nombre" required>
                    <div id="error-nombre" class="error-campo" aria-live="polite"></div>
                </div>

                <div class="mb-2">
                    <label class="form-label" for="correo">Correo</label>
                    <input id="correo" class="form-control" type="email" autocomplete="email" placeholder="nombre@correo.cl" required>
                    <div id="error-correo" class="error-campo" aria-live="polite"></div>
                </div>

                <div class="mb-2">
                    <label class="form-label" for="asunto">Carta o asunto</label>
                    <input id="asunto" class="form-control" type="text" autocomplete="off" placeholder="Ej.: Consulta por Pikachu" required>
                    <div id="error-asunto" class="error-campo" aria-live="polite"></div>
                </div>

                <div class="mb-2">
                    <label class="form-label" for="consulta">Mensaje</label>
                    <textarea id="consulta" class="form-control" rows="5" placeholder="Escribe tu consulta" required></textarea>
                    <div id="error-consulta" class="error-campo" aria-live="polite"></div>
                </div>

                <button class="btn btn-nexo" type="submit">Validar consulta</button>
                <div id="mensajeContacto" class="alerta-local" role="alert" aria-live="polite"></div>
            </form>
        </section>
    </div>
</main>
<footer>
    <p>&copy; 2026 NexoCartas · Proyecto académico DSY1104 Desarrollo Fullstack II</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/storage.js"></script>
<script src="js/sesion.js"></script>
<script src="js/formularios.js"></script>
</body>
</html>
