<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoCartas | Carrito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/carrito.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container py-3" aria-label="Navegación principal">
        <a class="navbar-brand marca" href="index.html">NexoCartas</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navNexo"
                aria-controls="navNexo"
                aria-expanded="false"
                aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navNexo">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="carrito.html">
                        Carrito (<span id="cantidadCarrito">0</span>)
                    </a>
                </li>
                <li class="nav-item admin-only"><a class="nav-link" href="admin.html">Administración</a></li>
                <li class="nav-item"><a class="nav-link cerrarSesion" href="#">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>
</header>

<main>
    <div class="contenedor-nexo">
        <section class="bloque-nexo" aria-labelledby="carritoTitulo">

            <h1 id="carritoTitulo" class="titulo-seccion">Mi carrito</h1>

            <div id="listaCarrito" aria-live="polite">
                <!-- JavaScript generará aquí los productos del carrito -->
            </div>

            <div id="resumenCarrito" class="resumen-card">
                <h2>Resumen de compra</h2>

                <p>
                    Total:
                    <strong id="totalCarrito">$0</strong>
                </p>

                <button id="btnFinalizarCompra" class="btn-nexo btn-dorado" type="button">
                    Finalizar compra
                </button>
            </div>

        </section>
    </div>
</main>

<footer>
    <p>&copy; 2026 NexoCartas · Proyecto académico DSY1104 Desarrollo Fullstack II</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/storage.js"></script>
<script src="js/navegacion.js"></script>
<script src="js/sesion.js"></script>
<script src="js/carrito.js"></script>

</body>
</html>
