<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoCartas | Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
</head>
<body>
<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container py-3" aria-label="Navegación principal">
        <a class="navbar-brand marca d-flex align-items-center gap-2" href="index.html"><img src="img/logo.svg" alt="" width="40" height="40"><span>NexoCartas</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navNexo" aria-controls="navNexo" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navNexo">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                <li class="nav-item admin-only"><a class="nav-link" href="admin.html">Administración</a></li>
                <li class="nav-item"><a class="nav-link cerrarSesion" href="#">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>
</header>
<main id="contenidoAdmin">
    <div class="contenedor-nexo">
        <section class="bloque-nexo" aria-labelledby="tituloFormulario">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h1 id="tituloFormulario" class="titulo-seccion mb-0">Agregar carta</h1>
                <button id="btnReiniciarDemo" class="btn btn-outline-secondary" type="button">Restablecer demo</button>
            </div>

            <form id="formCarta" novalidate>
                <input id="idCarta" type="hidden">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="codigo">Código *</label>
                        <input id="codigo" class="form-control" type="text" placeholder="PKM-004" required>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="form-label" for="nombreCarta">Nombre *</label>
                        <input id="nombreCarta" class="form-control" type="text" required>
                    </div>
                    <div class="col-12 col-md-5">
                        <label class="form-label" for="categoriaCarta">Categoría *</label>
                        <input id="categoriaCarta" class="form-control" type="text" list="listaCategorias" placeholder="Pokémon" required>
                        <datalist id="listaCategorias"></datalist>
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label" for="precio">Precio CLP *</label>
                        <input id="precio" class="form-control" type="number" min="0" step="1" required>
                    </div>
                    <div class="col-6 col-md-4">
                        <label class="form-label" for="stock">Stock *</label>
                        <input id="stock" class="form-control" type="number" min="0" step="1" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="imagen">Imagen (ruta local o URL)</label>
                        <input id="imagen" class="form-control" type="text" placeholder="img/carta-generica.svg">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="descripcion">Descripción *</label>
                        <textarea id="descripcion" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="col-12 d-flex flex-wrap gap-4">
                        <div class="form-check">
                            <input id="activo" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="activo">Producto activo</label>
                        </div>
                        <div class="form-check">
                            <input id="destacado" class="form-check-input" type="checkbox">
                            <label class="form-check-label" for="destacado">Destacado</label>
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button class="btn btn-nexo" type="submit">Guardar carta</button>
                    <button id="btnCancelarEdicion" class="btn btn-outline-secondary" type="button">Limpiar / cancelar edición</button>
                </div>
                <div id="mensajeAdmin" class="alerta-local" role="alert" aria-live="polite"></div>
            </form>
        </section>

        <section class="bloque-nexo" aria-labelledby="inventarioTitulo">
            <h2 id="inventarioTitulo" class="titulo-seccion">Inventario</h2>
            <div class="tabla-wrap">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCartas"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<footer>
    <p>&copy; 2026 NexoCartas · Proyecto académico DSY1104 Desarrollo Fullstack II</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/storage.js"></script>
<script src="js/sesion.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
